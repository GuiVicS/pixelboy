<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PixelBoy · Emulador de consoles</title>
<meta name="theme-color" content="#14121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PixelBoy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --fundo:#14121c; --card:#1f1c2b; --borda:#2e2a40; --texto:#ecebf3; --sub:#9a97ad; --roxo:#7b5cff;
    --casca:#d4d0c8; --casca-escura:#b9b4aa; --moldura:#5c5f70; --marca:#2b2f77;
    --botao:#a3195b; --botao-claro:#c0377a; --cinza:#55525a;
    --pixel:'Press Start 2P', monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --topo:env(safe-area-inset-top); --base:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font-family:var(--sans);
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
  input[type=file]{display:none}
  .ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
  .icone .ic{width:20px;height:20px}
  .bt .ic{width:46%;height:46%;stroke-width:2.6}
  .capa .play .ic{width:16px;height:16px;fill:currentColor}
  .legenda b .ic{width:14px;height:14px;margin-left:2px}

  /* ======================= GALERIA (mobile first) ======================= */
  #app{min-height:100%;padding:0 0 calc(var(--base) + 96px)}
  body.jogando #app{display:none}
  .barra{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
    padding:calc(var(--topo) + 12px) 16px 12px;background:rgba(20,18,28,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--borda)}
  .barra h1{margin:0;font-size:20px;font-weight:900;font-style:italic;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barra h1 small{font-size:10px;font-style:normal;letter-spacing:2px;color:var(--sub);margin-left:6px}
  .icone{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:18px;flex:none}
  .icone:active{transform:scale(.94)}
  .conteudo{padding:16px;max-width:980px;margin:0 auto}
  .secao{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 12px}
  .secao h2{margin:0;font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
  .secao span{font-size:12px;color:var(--sub)}

  .grade{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
  @media (min-width:600px){.grade{grid-template-columns:repeat(3,1fr)}}
  @media (min-width:880px){.grade{grid-template-columns:repeat(4,1fr)}}

  .console{position:relative;border-radius:18px;padding:14px;min-height:118px;overflow:hidden;text-align:left;
    background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .console:active{transform:scale(.97)}
  .console .sigla{font-family:var(--pixel);font-size:17px;color:rgba(255,255,255,.95);text-shadow:0 2px 0 rgba(0,0,0,.35)}
  .console .nome{position:absolute;left:14px;bottom:30px;right:10px;font-weight:700;font-size:14px}
  .console .qtd{position:absolute;left:14px;bottom:11px;font-size:12px;color:rgba(255,255,255,.75)}
  .console .deco{position:absolute;right:-18px;top:-18px;width:86px;height:86px;border-radius:50%;border:10px solid rgba(255,255,255,.08)}
  .console.vazio{filter:saturate(.35) brightness(.8)}

  .jogo{position:relative;display:flex;flex-direction:column;gap:7px;text-align:left}
  .capa{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;display:grid;place-items:center;
    background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 40%,#000));
    box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .jogo:active .capa{transform:scale(.97)}
  .capa .ini{font-family:var(--pixel);font-size:26px;color:rgba(255,255,255,.92);text-shadow:0 3px 0 rgba(0,0,0,.35)}
  .capa .play{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:14px}
  .capa .selo{position:absolute;left:8px;top:8px;display:flex;gap:4px}
  .capa .selo i{font-style:normal;font-size:10px;font-weight:800;background:rgba(0,0,0,.5);padding:3px 6px;border-radius:6px}
  .jogo .titulo{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .jogo .mais{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);font-size:16px;z-index:2}

  .vazio-box{background:var(--card);border:1px dashed var(--borda);border-radius:18px;padding:26px 18px;text-align:center;color:var(--sub);font-size:14px;line-height:1.55;margin-bottom:22px}
  .vazio-box b{color:var(--texto)}

  .fab{position:fixed;right:18px;bottom:calc(var(--base) + 18px);z-index:20;display:flex;align-items:center;gap:8px;
    background:var(--botao);color:#fff;font-weight:800;font-size:15px;padding:15px 20px;border-radius:999px;box-shadow:0 8px 22px rgba(163,25,91,.45)}
  body.jogando .fab{display:none}
  .fab:active{transform:scale(.96)}

  /* ======================= PLAYER: console portátil (vertical) ======================= */
  #shell{display:none}
  body.jogando{overflow:hidden;background:#2a2733;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  body.jogando #shell{display:flex}
  #shell{position:fixed;inset:0;margin:0 auto;max-width:520px;flex-direction:column;
    background:linear-gradient(180deg,var(--casca),#cbc6bd);border-radius:0 0 70px 0;color:#222;
    padding:calc(var(--topo) + 10px) 16px calc(var(--base) + 12px)}
  #topo{display:flex;align-items:center;gap:8px;color:#8a857c;font-size:9px;letter-spacing:1px;
    border-bottom:2px solid var(--casca-escura);padding:0 6px 6px;margin:0 -4px 12px}
  #topo .linha{flex:1;height:2px;background:var(--casca-escura)}
  #bezel{position:relative;background:var(--moldura);border-radius:10px 10px 44px 10px;padding:14px 26px 12px}
  #bezel .rotulo{display:flex;align-items:center;gap:8px;color:#b9bccd;font-size:8px;letter-spacing:1.5px;margin-bottom:9px;font-style:italic;white-space:nowrap}
  #bezel .rotulo i{flex:1;height:3px;background:linear-gradient(#8f2a4f 0 33%,transparent 33% 66%,#2b2f77 66%)}
  #led{position:absolute;left:9px;top:46%;width:8px;height:8px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b}
  #tela{position:relative;width:100%;aspect-ratio:4/3;background:#000;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
  #game{position:absolute;inset:0}
  #marca{margin:10px 2px 6px;color:var(--marca);font-weight:900;font-style:italic;font-size:22px;display:flex;align-items:baseline;gap:8px;min-width:0}
  #marca small{font-size:10px;font-weight:700;letter-spacing:1px;font-style:normal;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .pilula{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--cinza);color:#eee;
    border-radius:999px;padding:10px 14px;font-weight:700;font-size:13px;box-shadow:0 3px 0 #3a383e}
  .pilula:active{transform:translateY(2px);box-shadow:0 1px 0 #3a383e}
  .pilula.destaque{background:var(--botao);box-shadow:0 3px 0 #6d0f3b}

  /* ---- controles clássicos ---- */
  #controles{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0 6px;min-height:0}
  body.modo-gestos #controles{display:none}
  .ombros{display:flex;justify-content:space-between}
  .ombro{width:30%;height:28px;border-radius:14px;background:#a9a49b;color:#57534d;font-weight:800;font-size:12px;box-shadow:0 3px 0 #8d887f;touch-action:none}
  .ombro.on{transform:translateY(2px);box-shadow:0 1px 0 #8d887f;background:#9a958c}
  .meio{display:flex;justify-content:space-between;align-items:center;flex:1;min-height:0;padding:0 2px}
  #dpad{--t:min(38vw,23vh,170px);position:relative;width:var(--t);height:var(--t);touch-action:none}
  #dpad .h,#dpad .v{position:absolute;background:#2f2d33;border-radius:6px;box-shadow:0 4px 0 #1b1a1e}
  #dpad .h{left:0;right:0;top:33.3%;height:33.4%} #dpad .v{top:0;bottom:0;left:33.3%;width:33.4%}
  #dpad .centro{position:absolute;left:41%;top:41%;width:18%;height:18%;border-radius:50%;background:#26252a}
  #dpad .seta{position:absolute;width:0;height:0;border:7px solid transparent;opacity:.45}
  #dpad .s4{left:50%;top:7%;transform:translateX(-50%);border-bottom-color:#999}
  #dpad .s5{left:50%;bottom:7%;transform:translateX(-50%);border-top-color:#999}
  #dpad .s6{top:50%;left:7%;transform:translateY(-50%);border-right-color:#999}
  #dpad .s7{top:50%;right:7%;transform:translateY(-50%);border-left-color:#999}
  #dpad[data-dir~="4"] .s4,#dpad[data-dir~="5"] .s5,#dpad[data-dir~="6"] .s6,#dpad[data-dir~="7"] .s7{opacity:1}
  #abxy{--t:min(42vw,25vh,180px);position:relative;width:var(--t);height:var(--t);transform:rotate(-12deg)}
  .bt{position:absolute;width:36%;height:36%;border-radius:50%;background:var(--botao);color:#f6d5e4;font-weight:800;font-size:15px;
    box-shadow:0 4px 0 #6d0f3b,inset 0 -3px 0 rgba(0,0,0,.15);touch-action:none}
  .bt.on{transform:translateY(3px);box-shadow:0 1px 0 #6d0f3b}
  .bt.x{left:32%;top:0;background:var(--botao-claro)} .bt.y{left:0;top:32%;background:var(--botao-claro)}
  .bt.a{right:0;top:32%} .bt.b{left:32%;bottom:0}
  .bt span{display:inline-block;transform:rotate(12deg)}
  body[data-layout="2"] .bt.x,body[data-layout="2"] .bt.y,body[data-layout="2lr"] .bt.x,body[data-layout="2lr"] .bt.y,
  body[data-layout="2"] .ombros{visibility:hidden}
  body[data-layout="2"] .bt.a,body[data-layout="2lr"] .bt.a{right:4%;top:18%}
  body[data-layout="2"] .bt.b,body[data-layout="2lr"] .bt.b{left:10%;top:44%;bottom:auto}
  .so64,#n64pad{display:none}
  body[data-layout="n64"] .so64{display:block}
  body[data-layout="n64"] #abxy,body[data-layout="n64"] .ss.sel{display:none}
  body[data-layout="n64"] #n64pad{display:block}
  #n64pad{--t:min(44vw,26vh,190px);position:relative;width:var(--t);height:var(--t)}
  #n64pad .c{position:absolute;width:22%;height:22%;border-radius:50%;background:#e8b923;color:#6b5208;font-size:11px;box-shadow:0 3px 0 #9c7a10;touch-action:none}
  #n64pad .c.on{transform:translateY(2px);box-shadow:0 1px 0 #9c7a10}
  #n64pad .cu{left:62%;top:0}#n64pad .cd{left:62%;top:40%}#n64pad .cl{left:44%;top:20%}#n64pad .cr{left:78%;top:20%}
  #n64pad .n64a{width:34%;height:34%;left:22%;top:62%;background:#2856c6;box-shadow:0 4px 0 #173378}
  #n64pad .n64b{width:28%;height:28%;left:0;top:34%;background:#2a9d45;box-shadow:0 4px 0 #17602a}
  #n64pad .bt span{transform:none}
  .ombros .ombro.so64{width:22%}

  /* ---- controle clássico gerado por console ---- */
  .c-ombros{display:flex;justify-content:space-between;gap:8px}
  .c-ombros .ombro{flex:1;max-width:30%}
  .c-ombros.vazio{visibility:hidden}
  .c-meio{display:flex;justify-content:space-between;align-items:center;flex:1;min-height:0;padding:0 2px;gap:6px}
  .dpad{--t:min(38vw,22vh,165px);position:relative;width:var(--t);height:var(--t);touch-action:none;flex:none}
  .dpad.mini{--t:62px}
  .dpad .h,.dpad .v{position:absolute;background:#2f2d33;border-radius:6px;box-shadow:0 4px 0 #1b1a1e}
  .dpad .h{left:0;right:0;top:33.3%;height:33.4%} .dpad .v{top:0;bottom:0;left:33.3%;width:33.4%}
  .dpad .centro{position:absolute;left:41%;top:41%;width:18%;height:18%;border-radius:50%;background:#26252a}
  .dpad .seta{position:absolute;width:0;height:0;border:7px solid transparent;opacity:.45}
  .dpad.mini .seta{border-width:4px}
  .dpad .s4{left:50%;top:7%;transform:translateX(-50%);border-bottom-color:#999}
  .dpad .s5{left:50%;bottom:7%;transform:translateX(-50%);border-top-color:#999}
  .dpad .s6{top:50%;left:7%;transform:translateY(-50%);border-right-color:#999}
  .dpad .s7{top:50%;right:7%;transform:translateY(-50%);border-left-color:#999}
  .dpad[data-dir~="4"] .s4,.dpad[data-dir~="5"] .s5,.dpad[data-dir~="6"] .s6,.dpad[data-dir~="7"] .s7{opacity:1}
  .joy{--t:min(36vw,21vh,155px);position:relative;width:var(--t);height:var(--t);border-radius:50%;flex:none;touch-action:none;
    background:radial-gradient(circle,#3a383f 0 55%,#2f2d33 56%);box-shadow:0 4px 0 #1b1a1e,inset 0 0 0 3px #26252a}
  .joy.mini{--t:78px}
  .joy i{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#6a6870,#3b3940);box-shadow:0 3px 6px rgba(0,0,0,.4);pointer-events:none}
  .joy small{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:9px;font-weight:800;color:var(--marca);letter-spacing:1px}
  .face{--t:min(44vw,25vh,185px);position:relative;width:var(--t);height:var(--t);flex:none}
  .face .bt{width:36%;height:36%}
  .face .bt span{transform:none}
  .f1 .bt{width:48%;height:48%;left:26%;top:26%}
  .f2 .bt{width:40%;height:40%}
  .f2 .bt:nth-child(1){left:4%;top:48%} .f2 .bt:nth-child(2){left:54%;top:14%}
  .f3 .bt{width:31%;height:31%}
  .f3 .bt:nth-child(1){left:0;top:52%} .f3 .bt:nth-child(2){left:34%;top:36%} .f3 .bt:nth-child(3){left:68%;top:20%}
  .f4 .bt:nth-child(1){left:32%;top:0;background:var(--botao-claro)} .f4 .bt:nth-child(2){left:0;top:32%;background:var(--botao-claro)}
  .f4 .bt:nth-child(3){left:64%;top:32%} .f4 .bt:nth-child(4){left:32%;top:64%}
  .f6 .bt{width:29%;height:29%;font-size:13px}
  .f6 .bt:nth-child(-n+3){background:var(--botao-claro)}
  .f6 .bt:nth-child(1){left:2%;top:22%} .f6 .bt:nth-child(2){left:35%;top:12%} .f6 .bt:nth-child(3){left:68%;top:2%}
  .f6 .bt:nth-child(4){left:2%;top:58%} .f6 .bt:nth-child(5){left:35%;top:48%} .f6 .bt:nth-child(6){left:68%;top:38%}
  .fn64 .c{position:absolute;width:22%;height:22%;border-radius:50%;background:#e8b923;color:#6b5208;font-size:11px;box-shadow:0 3px 0 #9c7a10;touch-action:none}
  .fn64 .c.on{transform:translateY(2px);box-shadow:0 1px 0 #9c7a10}
  .fn64 .cu{left:62%;top:0}.fn64 .cd{left:62%;top:40%}.fn64 .cl{left:44%;top:20%}.fn64 .cr{left:78%;top:20%}
  .fn64 .bt.n0{width:28%;height:28%;left:0;top:34%;background:#2a9d45;box-shadow:0 4px 0 #17602a}
  .fn64 .bt.n1{width:34%;height:34%;left:22%;top:62%;background:#2856c6;box-shadow:0 4px 0 #173378}
  .c-analog{display:flex;justify-content:space-around;padding:0 10px 22px}
  .c-sistema{display:flex;justify-content:center;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-top:2px}
  .c-sistema .ss{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--marca);font-size:9px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
  .c-sistema .ss button{width:54px;height:15px;border-radius:8px;background:#77737a;transform:rotate(-24deg);box-shadow:0 2px 0 #4f4c52;touch-action:none}
  .c-sistema .ss button.on{background:#5f5c63;box-shadow:none}
  .sel-start{display:flex;justify-content:center;gap:26px;margin-top:2px}
  .sel-start .ss{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--marca);font-size:10px;font-weight:800;letter-spacing:1px}
  .sel-start .ss button{width:62px;height:16px;border-radius:8px;background:#77737a;transform:rotate(-24deg);box-shadow:0 2px 0 #4f4c52;touch-action:none}
  .sel-start .ss button.on{background:#5f5c63;box-shadow:none}
  .menu-row{display:flex;gap:8px;justify-content:center;margin-top:10px}
  .menu-row .pilula{flex:1;max-width:130px}

  /* ---- modo celular (gestos) ---- */
  #gestos{display:none;flex:1;flex-direction:column;gap:8px;min-height:0;padding:2px 0 4px}
  body.modo-gestos #gestos{display:flex}
  #g-extras{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  #g-extras button{min-width:52px;padding:8px 10px;border-radius:12px;background:#a9a49b;color:#3f3c37;font-weight:800;font-size:11px;
    box-shadow:0 3px 0 #8d887f;touch-action:none}
  #g-extras button.on{transform:translateY(2px);box-shadow:0 1px 0 #8d887f}
  #g-extras .g-menu{display:none}
  #g-pad{flex:1;display:flex;gap:8px;min-height:0}
  .zona{position:relative;flex:1;border-radius:22px;background:rgba(60,56,66,.10);border:2px dashed rgba(60,56,66,.22);touch-action:none;overflow:hidden}
  .zona .dica{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:10px;font-weight:800;letter-spacing:.5px;
    color:rgba(43,47,119,.55);pointer-events:none;padding:0 8px;line-height:1.6}
  .stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(43,47,119,.12);
    border:2px solid rgba(43,47,119,.3);display:none;pointer-events:none}
  .stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(43,47,119,.55)}
  .stick.on{display:block}
  .onda{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(163,25,91,.35);pointer-events:none;animation:onda .45s ease-out forwards}
  .onda.segura{background:rgba(43,47,119,.4);animation-duration:.7s}
  @keyframes onda{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}

  /* Vertical: some com o controle virtual e a barra do EmulatorJS */
  @media (orientation:portrait){ .ejs_virtualGamepad_parent,.ejs_menu_bar{display:none!important} }
  body.modo-gestos .ejs_virtualGamepad_parent{display:none!important}

  /* ======================= HORIZONTAL: tela cheia ======================= */
  @media (orientation:landscape){
    body.jogando #shell{max-width:none;border-radius:0;padding:0;background:#000}
    body.jogando #topo,body.jogando #marca,body.jogando #controles,body.jogando #led,body.jogando #bezel .rotulo{display:none!important}
    body.jogando #bezel{position:fixed;inset:0;padding:0;border-radius:0;background:#000}
    body.jogando #tela{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;z-index:5;box-shadow:none}
    body.modo-gestos #gestos{position:fixed;inset:0;z-index:6;padding:calc(var(--topo) + 8px) calc(env(safe-area-inset-right) + 10px) 8px calc(env(safe-area-inset-left) + 10px);pointer-events:none}
    body.modo-gestos #g-pad{gap:24%}
    body.modo-gestos .zona{pointer-events:auto;background:transparent;border:none}
    body.modo-gestos .zona .dica{color:rgba(255,255,255,.3)}
    body.modo-gestos .stick{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}
    body.modo-gestos .stick i{background:rgba(255,255,255,.4)}
    body.modo-gestos #g-extras{pointer-events:auto;justify-content:flex-end}
    body.modo-gestos #g-extras button{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;backdrop-filter:blur(4px)}
    body.modo-gestos #g-extras .g-menu{display:block}
    body.modo-gestos #g-menu-row{display:none}
    body.sem-tela #g-pad{gap:56%}
  }

  /* ======================= FOLHAS / AVISOS ======================= */
  .fundo{position:fixed;inset:0;background:rgba(10,8,16,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .fundo.aberto{display:flex}
  .folha{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#1f1c2b;color:var(--texto);border-radius:22px 22px 0 0;
    padding:18px 18px calc(var(--base) + 18px);display:flex;flex-direction:column;gap:10px}
  .folha h4{margin:0 0 2px;font-size:17px}
  .folha h5{margin:8px 0 0;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.8px}
  .folha p{margin:0 0 4px;color:var(--sub);font-size:13px;line-height:1.45}
  .folha .pilula{background:#2e2a40;box-shadow:none;padding:13px}
  .folha .pilula.destaque{background:var(--botao)}
  .opcoes{display:flex;flex-direction:column;gap:8px}
  .opcao{display:flex;gap:12px;align-items:flex-start;background:#2a2638;border:2px solid transparent;border-radius:14px;padding:12px;text-align:left}
  .opcao.sel{border-color:var(--roxo)}
  .opcao b{display:block;font-size:14px;margin-bottom:2px}
  .opcao span{font-size:12px;color:var(--sub);line-height:1.4}
  .opcao .bola{width:20px;height:20px;border-radius:50%;border:2px solid var(--sub);flex:none;margin-top:1px}
  .opcao.sel .bola{border:6px solid var(--roxo)}
  .linha-cfg{display:flex;justify-content:space-between;align-items:center;background:#2a2638;border-radius:14px;padding:12px 14px;font-size:14px;width:100%;text-align:left}
  .chave{width:46px;height:28px;border-radius:14px;background:#4a4560;position:relative;flex:none}
  .chave::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
  .chave.on{background:var(--roxo)} .chave.on::after{left:21px}
  .duas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #mc-lista{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #mc-lista .pilula{font-size:12px;padding:11px 8px}
  .legenda{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .legenda div{display:flex;gap:10px;align-items:center;background:#2a2638;border-radius:12px;padding:9px 12px;line-height:1.35}
  .legenda div b{min-width:96px;color:#c9b8ff;font-size:12px}
  .lista-consoles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lista-consoles button{background:#2a2638;border-radius:12px;padding:10px;font-size:12px;text-align:left}
  #aviso{position:fixed;left:50%;top:calc(var(--topo) + 14px);transform:translateX(-50%) translateY(-160%);
    background:#2a2638;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;transition:transform .25s;
    max-width:90vw;text-align:center;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  #aviso.mostrar{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ======================= GALERIA ======================= -->
<div id="app">
  <header class="barra">
    <button class="icone" id="voltar" style="display:none" aria-label="Voltar"><i data-ic="arrow-left"></i></button>
    <h1 id="titulo">PixelBoy<small>WEB</small></h1>
    <button class="icone" id="abrir-config" aria-label="Configurações"><i data-ic="settings"></i></button>
  </header>
  <main class="conteudo" id="conteudo"></main>
  <button class="fab" id="b-add"><i data-ic="plus"></i> Adicionar</button>
</div>

<!-- ======================= PLAYER ======================= -->
<div id="shell">
  <div id="topo"><span>OFF · ON</span><span class="linha"></span></div>
  <div id="bezel">
    <div class="rotulo"><i></i><span id="rotulo-console">PIXELBOY</span><i></i></div>
    <span id="led"></span>
    <div id="tela"><div id="game"></div></div>
  </div>
  <div id="marca">PixelBoy<small id="nome-jogo"></small></div>

  <!-- Clássico: montado para cada console a partir de consoles.js -->
  <div id="controles"></div>

  <!-- Modo celular -->
  <div id="gestos">
    <div id="g-extras"></div>
    <div id="g-pad">
      <div class="zona" id="z-mov"><div class="dica" id="dica-mov">MOVER<br>arraste</div><div class="stick"><i></i></div></div>
      <div class="zona" id="z-acao"><div class="dica" id="dica-acao"></div></div>
    </div>
    <div class="menu-row" id="g-menu-row">
      <button class="pilula" data-acao="salvar"><i data-ic="save"></i> Salvar</button>
      <button class="pilula" data-acao="carregar"><i data-ic="folder-open"></i> Carregar</button>
      <button class="pilula" data-acao="menu"><i data-ic="menu"></i> Menu</button>
    </div>
  </div>
</div>

<!-- ======================= FOLHAS ======================= -->
<div class="fundo" id="f-config"><div class="folha" id="config-corpo"></div></div>
<div class="fundo" id="f-menu"><div class="folha" id="menu-corpo"></div></div>
<div class="fundo" id="f-gestos"><div class="folha" id="gestos-corpo"></div></div>
<div class="fundo" id="f-jogo"><div class="folha" id="jogo-corpo"></div></div>
<div class="fundo" id="f-console">
  <div class="folha">
    <h4>Qual console?</h4>
    <p id="mc-nome"></p>
    <div id="mc-lista"></div>
    <button class="pilula" data-c="">Cancelar</button>
  </div>
</div>

<input type="file" id="in-jogo" multiple>
<input type="file" id="in-zip">
<div id="aviso"></div>

<script src="icones.js"></script>
<script src="consoles.js"></script>
<script src="app.js"></script>
</body>
</html>
