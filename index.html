<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PixelBoy · Emulador de consoles</title>
<meta name="theme-color" content="#d4d0c8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PixelBoy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --casca:#d4d0c8; --casca-escura:#b9b4aa; --moldura:#5c5f70; --marca:#2b2f77;
    --lcd-fundo:#9bbc0f; --lcd-claro:#8bac0f; --lcd-medio:#306230; --lcd-texto:#0f380f;
    --botao:#a3195b; --botao-claro:#c0377a; --cinza:#55525a;
    --pixel:'Press Start 2P', monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#2a2733;font-family:var(--sans);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}

  /* ========== CORPO (estilo console portátil, modo vertical) ========== */
  #shell{position:fixed;inset:0;margin:0 auto;max-width:520px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--casca),#cbc6bd);
    border-radius:0 0 70px 0;
    padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 12px)}
  #topo{display:flex;align-items:center;gap:8px;color:#8a857c;font-size:9px;letter-spacing:1px;
    border-bottom:2px solid var(--casca-escura);padding:0 6px 6px;margin:0 -4px 12px}
  #topo .linha{flex:1;height:2px;background:var(--casca-escura)}

  #bezel{position:relative;background:var(--moldura);border-radius:10px 10px 44px 10px;padding:14px 26px 12px}
  #bezel .rotulo{display:flex;align-items:center;gap:8px;color:#b9bccd;font-size:8px;letter-spacing:1.5px;
    margin-bottom:9px;font-style:italic}
  #bezel .rotulo i{flex:1;height:3px;background:linear-gradient(#8f2a4f 0 33%,transparent 33% 66%,#2b2f77 66%)}
  #led{position:absolute;left:9px;top:46%;width:8px;height:8px;border-radius:50%;background:#3a1416}
  body.jogando #led{background:#ff3b3b;box-shadow:0 0 8px #ff3b3b}
  #led-txt{position:absolute;left:4px;top:calc(46% + 12px);font-size:6px;color:#b9bccd;letter-spacing:.5px}
  #tela{position:relative;width:100%;aspect-ratio:4/3;background:var(--lcd-fundo);overflow:hidden;
    box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
  body.jogando #tela{background:#000}

  #marca{margin:10px 2px 6px;color:var(--marca);font-weight:900;font-style:italic;font-size:22px;letter-spacing:.5px}
  #marca small{font-size:11px;font-weight:700;letter-spacing:2px;margin-left:6px;font-style:normal}

  /* ========== BIBLIOTECA (dentro da tela) ========== */
  #game{position:absolute;inset:0;display:none}
  body.jogando #game{display:block}
  body.jogando #biblioteca{display:none}
  #biblioteca{position:absolute;inset:0;overflow-y:auto;padding:10px;font-family:var(--pixel);color:var(--lcd-texto);
    font-size:9px;line-height:1.5;-webkit-user-select:none}
  #biblioteca h2{font-size:10px;margin:2px 0 8px;font-weight:400;border-bottom:2px solid var(--lcd-medio);padding-bottom:5px}
  #biblioteca h3{font-size:8px;margin:12px 0 6px;font-weight:400;opacity:.75}
  .item{display:flex;align-items:stretch;gap:6px;margin-bottom:6px}
  .item .abrir{flex:1;text-align:left;background:var(--lcd-claro);padding:7px 8px;border:2px solid var(--lcd-medio);
    font-family:var(--pixel);font-size:9px;line-height:1.5;color:var(--lcd-texto);overflow:hidden}
  .item .abrir:active{background:var(--lcd-medio);color:var(--lcd-fundo)}
  .item .abrir small{display:block;font-size:7px;opacity:.75;margin-top:3px}
  .item .apagar{width:30px;border:2px solid var(--lcd-medio);background:var(--lcd-claro);font-family:var(--pixel);
    font-size:9px;color:var(--lcd-texto)}
  .vazio{opacity:.8;margin-top:14px;text-align:center}

  /* ========== AÇÕES DA BIBLIOTECA ========== */
  #acoes{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:6px 6px 18px}
  body.jogando #acoes{display:none}
  .pilula{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--cinza);color:#eee;
    border-radius:999px;padding:13px 16px;font-weight:700;font-size:14px;letter-spacing:.5px;
    box-shadow:0 3px 0 #3a383e}
  .pilula:active{transform:translateY(2px);box-shadow:0 1px 0 #3a383e}
  .pilula.destaque{background:var(--botao);box-shadow:0 3px 0 #6d0f3b}
  .linha2{display:flex;gap:10px}.linha2 .pilula{flex:1;font-size:13px}

  /* ========== CONTROLES ========== */
  #controles{flex:1;display:none;flex-direction:column;justify-content:space-between;padding:4px 0 10px;min-height:0}
  body.jogando #controles{display:flex}
  .ombros{display:flex;justify-content:space-between}
  .ombro{width:30%;height:28px;border-radius:14px;background:#a9a49b;color:#57534d;font-weight:800;font-size:12px;
    box-shadow:0 3px 0 #8d887f}
  .ombro.on{transform:translateY(2px);box-shadow:0 1px 0 #8d887f;background:#9a958c}
  .meio{display:flex;justify-content:space-between;align-items:center;flex:1;min-height:0;padding:0 2px}

  #dpad{--t:min(38vw,24vh,170px);position:relative;width:var(--t);height:var(--t);touch-action:none}
  #dpad .h,#dpad .v{position:absolute;background:#2f2d33;border-radius:6px;box-shadow:0 4px 0 #1b1a1e}
  #dpad .h{left:0;right:0;top:33.3%;height:33.4%}
  #dpad .v{top:0;bottom:0;left:33.3%;width:33.4%}
  #dpad .centro{position:absolute;left:41%;top:41%;width:18%;height:18%;border-radius:50%;background:#26252a}
  #dpad .seta{position:absolute;width:0;height:0;border:7px solid transparent;opacity:.45}
  #dpad .s4{left:50%;top:7%;transform:translateX(-50%);border-bottom-color:#999}
  #dpad .s5{left:50%;bottom:7%;transform:translateX(-50%);border-top-color:#999}
  #dpad .s6{top:50%;left:7%;transform:translateY(-50%);border-right-color:#999}
  #dpad .s7{top:50%;right:7%;transform:translateY(-50%);border-left-color:#999}
  #dpad[data-dir~="4"] .s4,#dpad[data-dir~="5"] .s5,#dpad[data-dir~="6"] .s6,#dpad[data-dir~="7"] .s7{opacity:1}

  #abxy{--t:min(42vw,26vh,180px);position:relative;width:var(--t);height:var(--t);transform:rotate(-12deg)}
  .bt{position:absolute;width:36%;height:36%;border-radius:50%;background:var(--botao);color:#f6d5e4;font-weight:800;
    font-size:15px;box-shadow:0 4px 0 #6d0f3b, inset 0 -3px 0 rgba(0,0,0,.15);touch-action:none}
  .bt.on{transform:translateY(3px);box-shadow:0 1px 0 #6d0f3b}
  .bt.x{left:32%;top:0;background:var(--botao-claro)} .bt.y{left:0;top:32%;background:var(--botao-claro)}
  .bt.a{right:0;top:32%} .bt.b{left:32%;bottom:0}
  .bt span{display:inline-block;transform:rotate(12deg)}
  body[data-layout="2"] .bt.x, body[data-layout="2"] .bt.y, body[data-layout="2lr"] .bt.x, body[data-layout="2lr"] .bt.y,
  body[data-layout="2"] .ombros{visibility:hidden}
  body[data-layout="2"] .bt.a, body[data-layout="2lr"] .bt.a{right:4%;top:18%}
  body[data-layout="2"] .bt.b, body[data-layout="2lr"] .bt.b{left:10%;top:44%;bottom:auto}

  /* Nintendo 64: analógico no direcional, botões C amarelos, Z no ombro */
  .so64,#n64pad{display:none}
  body[data-layout="n64"] .so64{display:block}
  body[data-layout="n64"] #abxy,body[data-layout="n64"] .ss.sel{display:none}
  body[data-layout="n64"] #n64pad{display:block}
  #n64pad{--t:min(44vw,27vh,190px);position:relative;width:var(--t);height:var(--t)}
  #n64pad .c{position:absolute;width:22%;height:22%;border-radius:50%;background:#e8b923;color:#6b5208;font-size:11px;
    box-shadow:0 3px 0 #9c7a10;touch-action:none}
  #n64pad .c.on{transform:translateY(2px);box-shadow:0 1px 0 #9c7a10}
  #n64pad .cu{left:62%;top:0}#n64pad .cd{left:62%;top:40%}#n64pad .cl{left:44%;top:20%}#n64pad .cr{left:80%;top:20%}
  #n64pad .n64a{width:34%;height:34%;left:22%;top:62%;background:#2856c6;box-shadow:0 4px 0 #173378}
  #n64pad .n64b{width:28%;height:28%;left:0;top:34%;background:#2a9d45;box-shadow:0 4px 0 #17602a}
  #n64pad .bt span{transform:none}
  .ombros .ombro.so64{width:22%}
  .sel-start{display:flex;justify-content:center;gap:26px;margin-top:4px}
  .sel-start .ss{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--marca);font-size:10px;
    font-weight:800;letter-spacing:1px}
  .sel-start .ss button{width:62px;height:16px;border-radius:8px;background:#77737a;transform:rotate(-24deg);
    box-shadow:0 2px 0 #4f4c52;touch-action:none}
  .sel-start .ss button.on{background:#5f5c63;box-shadow:none}
  .menu-row{display:flex;gap:8px;justify-content:center;margin-top:10px}
  .menu-row .pilula{padding:9px 14px;font-size:12px;flex:1;max-width:130px}
  body.jogando .grade{display:none}
  .grade{position:absolute;right:28px;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;gap:7px;
    transform:rotate(-28deg);pointer-events:none;opacity:.8}
  .grade i{width:6px;height:44px;border-radius:3px;background:#a39e95;box-shadow:inset 1px 1px 2px rgba(0,0,0,.25)}

  /* ========== MENU / MODAL / AVISO ========== */
  .fundo{position:fixed;inset:0;background:rgba(10,8,16,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .fundo.aberto{display:flex}
  .folha{width:100%;max-width:520px;background:#f1eee8;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);
    display:flex;flex-direction:column;gap:10px}
  #mc-lista{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:52vh;overflow-y:auto}
  #mc-lista .pilula{font-size:12px;padding:11px 8px}
  .folha h4{margin:0 0 4px;color:var(--marca);font-size:15px}
  .folha p{margin:0 0 6px;color:#555;font-size:13px}
  #aviso{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-120%);
    background:#1f1c2b;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;transition:transform .25s;
    max-width:90vw;text-align:center;pointer-events:none}
  #aviso.mostrar{transform:translateX(-50%) translateY(0)}
  input[type=file]{display:none}

  /* Vertical: some com o controle virtual e a barra do EmulatorJS (os nossos ficam embaixo da tela) */
  @media (orientation:portrait){
    .ejs_virtualGamepad_parent,.ejs_menu_bar{display:none!important}
  }

  /* ========== HORIZONTAL: layout normal, jogo em tela cheia ========== */
  @media (orientation:landscape){
    html,body{background:#14121c}
    #shell{max-width:none;border-radius:0;background:#14121c;display:block;overflow-y:auto;
      padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 20px) 20px calc(env(safe-area-inset-left) + 20px)}
    #topo,#controles,.grade,#led,#led-txt,#bezel .rotulo{display:none!important}
    #shell{display:flex;flex-direction:column}
    #marca{order:-1;color:#ecebf3;margin:0 auto 12px;width:100%;max-width:900px;font-size:20px}
    #bezel{background:none;padding:0;border-radius:0;max-width:900px;margin:0 auto}
    #tela{aspect-ratio:auto;background:none;box-shadow:none;overflow:visible}
    #biblioteca{position:static;padding:0;font-family:var(--sans);color:#ecebf3;font-size:14px}
    #biblioteca h2{font-size:15px;border-color:#3a3550}
    #biblioteca h3{font-size:12px}
    .item .abrir,.item .apagar{background:#1f1c2b;border:1px solid #3a3550;border-radius:10px;color:#ecebf3;font-family:var(--sans);font-size:14px}
    .item .abrir small{font-size:12px}
    .item .apagar{width:44px}
    #acoes{max-width:900px;margin:16px auto 0;flex-direction:row;padding:0}
    #acoes .linha2{flex:2}
    body.jogando #shell{padding:0;overflow:hidden}
    body.jogando #marca{display:none}
    body.jogando #tela{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:#000;z-index:5}
  }
</style>
</head>
<body>
<div id="shell">
  <div id="topo"><span>◀ OFF · ON ▶</span><span class="linha"></span></div>

  <div id="bezel">
    <div class="rotulo"><i></i><span>EMULADOR · MULTI-CONSOLE</span><i></i></div>
    <span id="led"></span>
    <div id="tela">
      <div id="biblioteca"></div>
      <div id="game"></div>
    </div>
  </div>

  <div id="marca">PixelBoy<small>WEB</small></div>

  <!-- Biblioteca -->
  <div id="acoes">
    <button class="pilula destaque" id="b-add">+ Jogo</button>
    <div class="linha2">
      <button class="pilula" id="b-exp">⬇ Exportar zip</button>
      <button class="pilula" id="b-imp">⬆ Importar zip</button>
    </div>
  </div>

  <!-- Controles (modo vertical, jogando) -->
  <div id="controles">
    <div class="ombros">
      <button class="ombro" data-btn="10">L</button>
      <button class="ombro so64" data-btn="12">Z</button>
      <button class="ombro" data-btn="11">R</button>
    </div>
    <div class="meio">
      <div id="dpad" data-dir="">
        <div class="h"></div><div class="v"></div><div class="centro"></div>
        <i class="seta s4"></i><i class="seta s5"></i><i class="seta s6"></i><i class="seta s7"></i>
      </div>
      <div id="abxy">
        <button class="bt x" data-btn="9"><span>X</span></button>
        <button class="bt y" data-btn="1"><span>Y</span></button>
        <button class="bt a" data-btn="8"><span>A</span></button>
        <button class="bt b" data-btn="0"><span>B</span></button>
      </div>
      <div id="n64pad">
        <button class="c cu" data-btn="23" data-analog="1">▲</button>
        <button class="c cl" data-btn="21" data-analog="1">◀</button>
        <button class="c cr" data-btn="20" data-analog="1">▶</button>
        <button class="c cd" data-btn="22" data-analog="1">▼</button>
        <button class="bt n64a" data-btn="0"><span>A</span></button>
        <button class="bt n64b" data-btn="1"><span>B</span></button>
      </div>
    </div>
    <div>
      <div class="sel-start">
        <div class="ss sel"><button data-btn="2" aria-label="Select"></button>SELECT</div>
        <div class="ss"><button data-btn="3" aria-label="Start"></button>START</div>
      </div>
      <div class="menu-row">
        <button class="pilula" id="b-salvar">💾 Salvar</button>
        <button class="pilula" id="b-carregar">📂 Carregar</button>
        <button class="pilula" id="b-menu">☰ Menu</button>
      </div>
    </div>
  </div>
  <div class="grade"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>

<!-- Menu -->
<div class="fundo" id="menu">
  <div class="folha">
    <h4>Menu</h4>
    <button class="pilula" id="m-salvar">💾 Salvar estado</button>
    <button class="pilula" id="m-carregar">📂 Carregar estado</button>
    <button class="pilula" id="m-pausar">⏸ Pausar / continuar</button>
    <button class="pilula" id="m-reiniciar">↺ Reiniciar jogo</button>
    <button class="pilula destaque" id="m-sair">◀ Voltar à biblioteca</button>
    <button class="pilula" id="m-fechar" style="background:#999">Fechar</button>
  </div>
</div>

<!-- Escolha de console -->
<div class="fundo" id="modal-console">
  <div class="folha">
    <h4>Qual console?</h4>
    <p id="mc-nome"></p>
    <div id="mc-lista"></div>
    <button class="pilula" data-c="" style="background:#999">Cancelar</button>
  </div>
</div>

<input type="file" id="in-jogo" multiple>
<input type="file" id="in-zip">
<div id="aviso"></div>

<script>
const CDN = 'https://cdn.emulatorjs.org/stable/data/';
/* Consoles suportados: núcleo do EmulatorJS, nome, extensões e layout de botões no modo vertical
   layout: '4' = D-pad + A/B/X/Y + L/R  ·  '2' = D-pad + A/B  ·  '2lr' = A/B + L/R  ·  'n64' = analógico + C */
const CONSOLES = {
  nes:        { nome: 'NES',              ext: ['nes','fds','unf','unif'], layout: '2' },
  snes:       { nome: 'Super Nintendo',   ext: ['smc','sfc','fig','swc','bs','st'], layout: '4' },
  n64:        { nome: 'Nintendo 64',      ext: ['z64','n64','v64'], layout: 'n64' },
  gb:         { nome: 'Game Boy / Color', ext: ['gb','gbc','dmg','cgb','sgb'], layout: '2' },
  gba:        { nome: 'Game Boy Advance', ext: ['gba','agb'], layout: '2lr' },
  nds:        { nome: 'Nintendo DS',      ext: ['nds'], layout: '4' },
  vb:         { nome: 'Virtual Boy',      ext: ['vb','vboy'], layout: '2lr' },
  segaMS:     { nome: 'Master System',    ext: ['sms'], layout: '2' },
  segaMD:     { nome: 'Mega Drive',       ext: ['md','gen','smd','sg'], layout: '4' },
  segaGG:     { nome: 'Game Gear',        ext: ['gg'], layout: '2' },
  sega32x:    { nome: 'Sega 32X',         ext: ['32x'], layout: '4' },
  segaCD:     { nome: 'Sega CD',          ext: [], layout: '4' },
  segaSaturn: { nome: 'Sega Saturn',      ext: [], layout: '4' },
  psx:        { nome: 'PlayStation',      ext: ['pbp'], layout: '4' },
  pce:        { nome: 'PC Engine',        ext: ['pce','sgx'], layout: '2' },
  pcfx:       { nome: 'PC-FX',            ext: [], layout: '4' },
  ngp:        { nome: 'Neo Geo Pocket',   ext: ['ngp','ngc'], layout: '2' },
  ws:         { nome: 'WonderSwan',       ext: ['ws','wsc'], layout: '2' },
  lynx:       { nome: 'Atari Lynx',       ext: ['lnx'], layout: '2' },
  jaguar:     { nome: 'Atari Jaguar',     ext: ['j64','jag'], layout: '4' },
  atari2600:  { nome: 'Atari 2600',       ext: ['a26'], layout: '2' },
  a5200:      { nome: 'Atari 5200',       ext: ['a52'], layout: '2' },
  atari7800:  { nome: 'Atari 7800',       ext: ['a78'], layout: '2' },
  coleco:     { nome: 'ColecoVision',     ext: ['col'], layout: '2' },
  '3do':      { nome: '3DO',              ext: [], layout: '4' },
  arcade:     { nome: 'Arcade (FBNeo)',   ext: [], layout: '4' },
  mame2003:   { nome: 'Arcade (MAME 2003)', ext: [], layout: '4' },
};
const $ = s => document.querySelector(s);

const ext = n => (n.split('.').pop() || '').toLowerCase();
const consolePorExt = n => Object.keys(CONSOLES).find(c => CONSOLES[c].ext.includes(ext(n))) || null;
const nomeConsole = c => (CONSOLES[c] && CONSOLES[c].nome) || c;
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const semExt = n => n.replace(/\.[^.]+$/, '');
const vib = () => { try { navigator.vibrate && navigator.vibrate(8); } catch(e){} };

function aviso(txt){
  const a = $('#aviso'); a.textContent = txt; a.classList.add('mostrar');
  clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.remove('mostrar'), 2200);
}

/* ================= IndexedDB ================= */
const DB = (() => {
  let p;
  const abrir = () => p ||= new Promise((ok, erro) => {
    const r = indexedDB.open('pixelboy', 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore('jogos', { keyPath: 'id' });
      r.result.createObjectStore('saves', { keyPath: 'id' });
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => erro(r.error);
  });
  const tx = async (loja, modo, fn) => {
    const db = await abrir();
    return new Promise((ok, erro) => {
      const t = db.transaction(loja, modo);
      const req = fn(t.objectStore(loja));
      t.oncomplete = () => ok(req && req.result);
      t.onerror = () => erro(t.error);
    });
  };
  return {
    get: (l, k) => tx(l, 'readonly', o => o.get(k)),
    all: l => tx(l, 'readonly', o => o.getAll()),
    put: (l, v) => tx(l, 'readwrite', o => o.put(v)),
    del: (l, k) => tx(l, 'readwrite', o => o.delete(k)),
  };
})();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

/* ================= Biblioteca ================= */
let servidor = [];   // jogos da pasta roms/ do servidor
let atual = null;    // jogo em execução
let emuCarregado = false;

async function carregarServidor(){
  try {
    const r = await fetch('roms/lista.json', { cache: 'no-cache' });
    const lista = r.ok ? await r.json() : [];
    servidor = lista.filter(j => j && j.arquivo).map(j => ({
      id: 'srv-' + slug(j.arquivo),
      nome: j.nome || semExt(j.arquivo.split('/').pop()),
      arquivo: j.arquivo,
      console: j.console || (CONSOLES[j.arquivo.split('/')[0]] ? j.arquivo.split('/')[0] : null) || consolePorExt(j.arquivo) || 'snes',
      url: 'roms/' + j.arquivo.split('/').map(encodeURIComponent).join('/'),
      servidor: true,
    }));
  } catch(e) { servidor = []; }
}

function itemHTML(j, comSave){
  const tag = nomeConsole(j.console).toUpperCase() + (comSave ? ' · SAVE' : '');
  return `<div class="item" data-id="${j.id}">
    <button class="abrir">▶ ${esc(j.nome)}<small>${tag}</small></button>
    ${j.servidor ? '' : '<button class="apagar" aria-label="Apagar">✕</button>'}
  </div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function render(){
  const jogos = (await DB.all('jogos')).sort((a,b) => a.nome.localeCompare(b.nome));
  const saves = new Set((await DB.all('saves')).map(s => s.id));
  let h = '<h2>BIBLIOTECA</h2>';
  if (jogos.length) h += jogos.map(j => itemHTML(j, saves.has(j.id))).join('');
  else h += '<div class="vazio">Nenhum jogo ainda.<br><br>Toque em + Jogo</div>';
  if (servidor.length) h += '<h3>NO SERVIDOR</h3>' + servidor.map(j => itemHTML(j, saves.has(j.id))).join('');
  $('#biblioteca').innerHTML = h;
}

$('#biblioteca').addEventListener('click', async e => {
  const item = e.target.closest('.item'); if (!item) return;
  const id = item.dataset.id;
  if (e.target.closest('.apagar')) {
    const j = await DB.get('jogos', id);
    if (j && confirm(`Apagar "${j.nome}" e o save dele?`)) {
      await DB.del('jogos', id); await DB.del('saves', id); render(); aviso('Jogo apagado');
    }
    return;
  }
  const jogo = await acharJogo(id);
  if (jogo) jogar(jogo, true);
});

async function acharJogo(id){
  return (await DB.get('jogos', id)) || servidor.find(j => j.id === id) || null;
}

/* Escolha de console */
function perguntarConsole(nome){
  return new Promise(ok => {
    const m = $('#modal-console');
    $('#mc-nome').textContent = nome;
    $('#mc-lista').innerHTML = Object.keys(CONSOLES).map(c => `<button class="pilula" data-c="${c}">${CONSOLES[c].nome}</button>`).join('');
    m.classList.add('aberto');
    m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { m.classList.remove('aberto'); ok(b.dataset.c || null); });
  });
}

/* Adicionar jogos */
async function adicionarJogo(file){
  let c = consolePorExt(file.name);
  if (!c && ext(file.name) === 'zip' && window.JSZip) {
    try {
      const z = await JSZip.loadAsync(file);
      if (z.file('backup.json')) { await importarBackup(z); return; }
      for (const n of Object.keys(z.files)) { c = consolePorExt(n); if (c) break; }
    } catch(e) {}
  }
  if (!c) c = await perguntarConsole(file.name);
  if (!c) return;
  const id = slug(semExt(file.name)) + '-' + file.size;
  await DB.put('jogos', {
    id, nome: semExt(file.name), arquivo: file.name, console: c,
    tamanho: file.size, adicionado: Date.now(), dados: await file.arrayBuffer(),
  });
  aviso('Adicionado: ' + semExt(file.name));
}

$('#b-add').onclick = () => $('#in-jogo').click();
$('#in-jogo').onchange = async e => {
  for (const f of e.target.files) { try { await adicionarJogo(f); } catch(err) { aviso('Erro ao adicionar ' + f.name); } }
  e.target.value = ''; render();
};

/* ================= Exportar / importar zip ================= */
async function exportar(){
  if (!window.JSZip) return aviso('Sem conexão para carregar o zip');
  aviso('Gerando zip…');
  const z = new JSZip();
  const meta = { app: 'pixelboy', versao: 1, criado: new Date().toISOString(), jogos: [], saves: [] };
  for (const j of await DB.all('jogos')) {
    const caminho = `jogos/${j.id}/${j.arquivo}`;
    z.file(caminho, j.dados);
    meta.jogos.push({ id: j.id, nome: j.nome, arquivo: j.arquivo, console: j.console, adicionado: j.adicionado, caminho });
  }
  for (const s of await DB.all('saves')) {
    const m = { id: s.id, atualizado: s.atualizado };
    if (s.srm)   { m.srm = `saves/${s.id}.srm`;     z.file(m.srm, s.srm); }
    if (s.state) { m.state = `saves/${s.id}.state`; z.file(m.state, s.state); }
    meta.saves.push(m);
  }
  z.file('backup.json', JSON.stringify(meta, null, 2));
  const blob = await z.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pixelboy-backup-${new Date().toISOString().slice(0,10)}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 15000);
  aviso(`Backup: ${meta.jogos.length} jogos, ${meta.saves.length} saves`);
}

async function importarBackup(z){
  const meta = JSON.parse(await z.file('backup.json').async('string'));
  let nj = 0, ns = 0;
  for (const j of meta.jogos || []) {
    const f = z.file(j.caminho); if (!f) continue;
    const dados = await f.async('arraybuffer');
    await DB.put('jogos', { id: j.id, nome: j.nome, arquivo: j.arquivo, console: j.console,
      adicionado: j.adicionado || Date.now(), tamanho: dados.byteLength, dados });
    nj++;
  }
  for (const s of meta.saves || []) {
    const o = { id: s.id, atualizado: s.atualizado || Date.now() };
    if (s.srm && z.file(s.srm))     o.srm   = await z.file(s.srm).async('uint8array');
    if (s.state && z.file(s.state)) o.state = await z.file(s.state).async('uint8array');
    await DB.put('saves', o); ns++;
  }
  aviso(`Importado: ${nj} jogos, ${ns} saves`);
}

$('#b-exp').onclick = () => exportar().catch(() => aviso('Erro ao exportar'));
$('#b-imp').onclick = () => $('#in-zip').click();
$('#in-zip').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const z = await JSZip.loadAsync(f);
    if (z.file('backup.json')) await importarBackup(z);
    else await adicionarJogo(f);   // zip comum: trata como ROM
  } catch(err) { aviso('Esse arquivo não é um zip válido'); }
  render();
};

/* ================= Emulador ================= */
const gm = () => window.EJS_emulator && window.EJS_emulator.gameManager;

function jogar(jogo, peloToque){
  if (emuCarregado) {           // o EmulatorJS só inicia uma vez por página: recarrega
    salvarSRAM().finally(() => { sessionStorage.setItem('pb-abrir', jogo.id); location.reload(); });
    return;
  }
  emuCarregado = true; atual = jogo;
  document.body.classList.add('jogando');
  document.body.dataset.console = jogo.console;
  document.body.dataset.layout = (CONSOLES[jogo.console] || {}).layout || '4';

  window.EJS_player = '#game';
  window.EJS_core = jogo.console;
  window.EJS_gameName = jogo.nome;
  window.EJS_gameUrl = jogo.servidor ? jogo.url : new File([jogo.dados], jogo.arquivo);
  window.EJS_pathtodata = CDN;
  window.EJS_startOnLoaded = !!peloToque;
  window.EJS_color = '#a3195b';
  window.EJS_onGameStart = aoIniciar;

  const s = document.createElement('script');
  s.src = CDN + 'loader.js';
  document.body.appendChild(s);
  if (peloToque) telaCheiaSeHorizontal();
}

async function aoIniciar(){
  const g = gm(); if (!g || !atual) return;
  try {
    const s = await DB.get('saves', atual.id);
    if (s && s.srm) {
      g.FS.writeFile(g.getSaveFilePath(), s.srm);
      g.loadSaveFiles();
    }
  } catch(e) { console.warn('save', e); }
  setInterval(salvarSRAM, 20000);
}

async function salvarSRAM(){
  const g = gm(); if (!g || !atual) return;
  try {
    const d = g.getSaveFile();
    if (d && d.length) {
      const s = (await DB.get('saves', atual.id)) || { id: atual.id };
      s.srm = new Uint8Array(d); s.atualizado = Date.now();
      await DB.put('saves', s);
    }
  } catch(e) {}
}

async function salvarEstado(){
  const g = gm(); if (!g) return aviso('O jogo ainda não começou');
  try {
    const st = g.getState ? g.getState() : null;
    if (!st) return aviso('Este jogo não suporta estados');
    const s = (await DB.get('saves', atual.id)) || { id: atual.id };
    s.state = new Uint8Array(st); s.atualizado = Date.now();
    await DB.put('saves', s);
    await salvarSRAM();
    aviso('Estado salvo 💾');
  } catch(e) { aviso('Não foi possível salvar'); }
}

async function carregarEstado(){
  const g = gm(); if (!g) return aviso('O jogo ainda não começou');
  const s = await DB.get('saves', atual.id);
  if (!s || !s.state) return aviso('Nenhum estado salvo ainda');
  try { g.loadState(s.state); aviso('Estado carregado'); } catch(e) { aviso('Erro ao carregar'); }
}

let pausado = false;
function pausar(){ const g = gm(); if (!g) return; pausado = !pausado; g.toggleMainLoop(pausado ? 0 : 1); aviso(pausado ? 'Pausado' : 'Continuando'); }

document.addEventListener('visibilitychange', () => { if (document.hidden) salvarSRAM(); });
window.addEventListener('pagehide', salvarSRAM);

/* Tela cheia no horizontal */
const ehToque = matchMedia('(pointer:coarse)').matches;
const horizontal = () => matchMedia('(orientation:landscape)').matches;
function telaCheiaSeHorizontal(){
  if (!ehToque || !horizontal() || document.fullscreenElement) return;
  const el = document.documentElement;
  try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' })?.catch?.(() => {}); } catch(e) {}
}
$('#tela').addEventListener('pointerdown', () => { if (document.body.classList.contains('jogando')) telaCheiaSeHorizontal(); });

/* ================= Controles (modo vertical) ================= */
function press(i, v){ const g = gm(); if (g) try { g.simulateInput(0, i, v); } catch(e) {} }
const ANALOG = 0x7fff;
// No N64 o direcional vira o analógico esquerdo (16 = direita, 17 = esquerda, 18 = baixo, 19 = cima)
const DIR_N64 = { 4: 19, 5: 18, 6: 17, 7: 16 };
function pressDir(d, on){
  if (document.body.dataset.console === 'n64') press(DIR_N64[d], on ? ANALOG : 0);
  else press(d, on ? 1 : 0);
}

document.querySelectorAll('[data-btn]').forEach(b => {
  const i = +b.dataset.btn;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch(_) {}
    b.classList.add('on'); press(i, b.dataset.analog ? ANALOG : 1); vib();
  });
  const solta = () => { if (!b.classList.contains('on')) return; b.classList.remove('on'); press(i, 0); };
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev => b.addEventListener(ev, solta));
});

const dpad = $('#dpad');
let dirs = new Set();
function setDirs(novas){
  for (const d of [4,5,6,7]) if (novas.has(d) !== dirs.has(d)) pressDir(d, novas.has(d));
  if (novas.size && !dirs.size) vib();
  dirs = novas; dpad.dataset.dir = [...novas].join(' ');
}
function dirsDoPonto(e){
  const r = dpad.getBoundingClientRect();
  const x = e.clientX - (r.left + r.width/2), y = e.clientY - (r.top + r.height/2);
  const s = new Set();
  if (Math.hypot(x, y) < r.width * 0.1) return s;
  const a = Math.atan2(y, x) * 180 / Math.PI;     // 0 = direita, 90 = baixo
  if (a > -67.5 && a < 67.5) s.add(7);
  if (a > 112.5 || a < -112.5) s.add(6);
  if (a > 22.5 && a < 157.5) s.add(5);
  if (a < -22.5 && a > -157.5) s.add(4);
  return s;
}
dpad.addEventListener('pointerdown', e => { e.preventDefault(); try { dpad.setPointerCapture(e.pointerId); } catch(_) {} setDirs(dirsDoPonto(e)); });
dpad.addEventListener('pointermove', e => { if (dpad.hasPointerCapture && dpad.hasPointerCapture(e.pointerId)) setDirs(dirsDoPonto(e)); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev => dpad.addEventListener(ev, () => setDirs(new Set())));
document.addEventListener('contextmenu', e => { if (e.target.closest('#controles')) e.preventDefault(); });

/* Menu */
const menu = $('#menu');
const fecharMenu = () => menu.classList.remove('aberto');
$('#b-salvar').onclick = salvarEstado;
$('#b-carregar').onclick = carregarEstado;
$('#b-menu').onclick = () => menu.classList.add('aberto');
$('#m-fechar').onclick = fecharMenu;
menu.addEventListener('click', e => { if (e.target === menu) fecharMenu(); });
$('#m-salvar').onclick = () => { fecharMenu(); salvarEstado(); };
$('#m-carregar').onclick = () => { fecharMenu(); carregarEstado(); };
$('#m-pausar').onclick = () => { fecharMenu(); pausar(); };
$('#m-reiniciar').onclick = () => { fecharMenu(); const g = gm(); if (g) { g.restart(); aviso('Reiniciado'); } };
$('#m-sair').onclick = () => { fecharMenu(); salvarSRAM().finally(() => location.reload()); };

/* ================= Início ================= */
(async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  await carregarServidor();
  await render();
  const pendente = sessionStorage.getItem('pb-abrir');
  if (pendente) {
    sessionStorage.removeItem('pb-abrir');
    const j = await acharJogo(pendente);
    if (j) jogar(j, false);
  }
})();
</script>
